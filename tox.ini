[tox]
envlist = py311, py312, py313, py314, pypy311, lint, typing, docs
isolated_build = true
requires = tox-uv

[testenv]
extras = dev
commands = pytest {posargs}

[testenv:lint]
extras = dev
commands = ruff check src tests

# tests/typing/check_*.py mark each expected error with an ignore comment,
# which both checkers are set to report if unused.
[testenv:typing]
extras = dev
commands =
    mypy src
    mypy --strict tests/typing
    pyright src
    pyright -p tests/typing

[testenv:benchmark]
extras = dev
commands = pytest -m benchmark {posargs}

[testenv:docs]
extras = docs
commands = mkdocs build --strict
