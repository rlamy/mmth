[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmth"
version = "0.1.0"
description = "A simple multiple-dispatch library for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Ronan Lamy", email = "ronan.lamy@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/rlamy/mmth"
Repository = "https://github.com/rlamy/mmth"
Documentation = "https://mmth.readthedocs.io"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.168.0",
    "mypy>=1.18",
    "pyright>=1.1.400",
    "pytest>=8",
    "pytest-benchmark>=5.3.0",
    "ruff>=0.6",
    "tox>=4",
    "tox-uv>=1",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9",
    "mkdocstrings[python]>=0.26",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-m 'not benchmark'"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["D", "E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-local-folder = ["strategies"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# test names say what they test
"tests/*" = ["D1"]
